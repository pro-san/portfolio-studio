
name: Extract Portfolio Studio source

on:
  workflow_dispatch:
  push:
    paths:
      - "portfolio-studio-netlify-ready-4035c.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source files
        run: |
          mkdir -p extracted-source
          unzip -o portfolio-studio-netlify-ready-4035c.zip -d extracted-source
          cp -a extracted-source/portfolio-platform/. .
          rm -rf extracted-source
          rm -f portfolio-studio-netlify-ready-4035c.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Portfolio Studio source"
            git push
          fi
